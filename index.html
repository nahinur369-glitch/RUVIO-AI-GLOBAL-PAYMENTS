    if (amt > srcWallet.availableBalance) {

      pushToast('Duplicate Blocked', dupMsg, 'warning');
      return;
    }
    lastPeerLockRef.current = dedupSignature;
    const {
      converted: usdCredited,
      sampleRate
    } = convertSampleCurrency(amt, srcWallet.currency, 'USD');

    }
